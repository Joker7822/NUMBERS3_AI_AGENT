name: Numbers3 Online Learning Recovery Watchdog
on:
  workflow_run:
    workflows: ['Numbers3 Online Learning 2-Hour Cycle']
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  bounded-recovery:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      FAILED_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Retry failed jobs once, not an infinite loop
        if: env.RUN_ATTEMPT == '1'
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
      - name: Deduplicate failure incident after final retry
        if: env.RUN_ATTEMPT != '1'
        run: |
          set -euo pipefail
          title="Numbers3: online learning failed after retry"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title')"
          if grep -Fxq "$title" <<< "$existing"; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "Online learning failed after one retry: $FAILED_URL . Inspect data-source diagnostics and tests. No predictions, purchases or model promotions were authorized."
